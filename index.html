<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors Example</title>
    <!-- This line links the HTML to the external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Targeted by the Type Selector (h1) -->
    <h1 id="red_underline_text">This heading will be grey.</h1>

    <!-- Targeted by the Class Selector (.blue_overline_text) -->
    <p class="blue_overline_text">This paragraph uses a class. It will be blue with a line over it.</p>
    
    <!-- Classes can be reused on multiple elements -->
    <div class="blue_overline_text">This div also uses the same class and gets the same styling.</div>

    <!-- Targeted by the ID Selector (#red_underline_text) -->
    <!-- Note: An ID should only be used on one unique element per page -->
    <p id="red_underline_text">This paragraph uses an ID. It will be red and underlined.</p>
    

</body>
</html>
